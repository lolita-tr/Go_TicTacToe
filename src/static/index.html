<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <style>
        td {
            width: 50px; height: 50px;
            text-align: center;
            font-size: 24px;
            border: 1px solid #000;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h1>Крестики-нолики</h1>
<table id="board"></table>
<button onclick="resetGame()">Новая игра</button>
<div id="status"></div>


<script>
    let gameId = null

    async function startNewGame() {
        const res = await fetch("/new");
        const data = await res.json();
        gameId = data.game_id;
        await renderBoard();
    }

    async function getBoard() {
        const res = await fetch(`/board?id=${gameId}`);
        return await res.json();
    }

    async function makeMove(row, col) {
        const res = await fetch(`/move?id=${gameId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ row, col }),
        });

        await renderBoard();

        const result = await res.json();

        if (result.winner !== 0) {
            const status = document.getElementById("status");
            status.textContent = result.winner === 1 ? "Победил Робот (🤖)" : "Победил человек (O)";
            disableBoard();
        }
    }

    function disableBoard() {
        const cells = document.querySelectorAll("td");
        cells.forEach(cell => {
            cell.onclick = null;
        });
    }

    async function resetGame() {
        await fetch(`/reset?id=${gameId}`, { method: "POST" });
        document.getElementById("status").textContent = "";
        await renderBoard();
    }

    async function renderBoard() {
        const board = await getBoard();
        const table = document.getElementById("board");
        table.innerHTML = "";
        board.forEach((row, i) => {
            const tr = document.createElement("tr");
            row.forEach((cell, j) => {
                const td = document.createElement("td");
                td.textContent = cell === 1 ? "X" : (cell === 2 ? "O" : "");
                td.onclick = () => makeMove(i, j);
                tr.appendChild(td);
            });
            table.appendChild(tr);
        });
    }

    startNewGame();
</script>
</body>
</html>
